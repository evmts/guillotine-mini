# .agents/uphill/uphill.yaml — Continuous metrics and hill climbing for evmts/guillotine-mini.
# Scripts run from the repository root and append metric lines to $UPHILL_METRICS.

safety:
  title: Safety & TigerStyle
  description: Crash-free EVM execution, error propagation, and type-safety across Zig and TypeScript.
  run: bun .agents/uphill/metrics/safety.ts
  # Production Zig files must return errors rather than crashing with @panic or unreachable (TigerStyle).
  zig-no-panic:
    description: Never use @panic or unreachable in production src/ or client/ Zig code; validate and return typed errors.
    weight: 2
  # Production Zig modules must use logger.zig instead of raw std.debug.print.
  zig-no-debug-print:
    description: Replace std.debug.print in production src/ and client/ Zig modules with logger.zig.
  # Production Zig code must not swallow errors with empty catch {} or stub error.NotImplemented.
  zig-no-swallowed-errors:
    description: Never swallow errors with empty catch {} or leave error.NotImplemented stubs in production Zig code.
    weight: 2
  # Runtime assertion density per 1,000 production Zig LOC (TigerStyle recommends >=2 assertions per function).
  zig-assertion-density:
    description: Add invariant assertions to production Zig functions to raise assertion density toward TigerStyle targets.
    better: higher
    poor: 0.25
  # Production TypeScript files in ts/ and client-ts/ must avoid explicit `any`.
  ts-no-explicit-any:
    description: Replace explicit `any` annotations and `as any` casts in ts/ and client-ts/ with narrow types.
    weight: 1.5
  # Production TypeScript files must not suppress compiler errors with @ts-ignore/@ts-expect-error/@ts-nocheck.
  ts-no-suppress:
    description: Fix underlying TypeScript errors instead of using @ts-ignore, @ts-expect-error, or @ts-nocheck.

style:
  title: Style & Limits
  description: TigerStyle structural bounds (70-line functions, 120-char lines) and canonical Zig formatting.
  run: bun .agents/uphill/metrics/style.ts
  # Canonical formatting verified by `zig fmt --check src client`.
  zig-fmt:
    description: Keep all Zig files in src/ and client/ formatted with `zig fmt`.
    weight: 2
  # Maximum runtime function length in lines per production Zig file (TigerStyle limit: 70 lines).
  function-length:
    description: Keep every production Zig runtime function at or below 70 lines (TigerStyle limit).
    poor: 160
    weight: 2
  # Line length check per production Zig file (TigerStyle limit: 120 columns).
  line-length:
    description: Keep production Zig lines at or below 120 characters (TigerStyle limit).
  # Production Zig and TypeScript files must not accumulate TODO/FIXME/XXX/HACK markers.
  no-todo-markers:
    description: Resolve TODO, FIXME, XXX, and HACK markers in production Zig and TypeScript modules.

footprint:
  title: Footprint & Minimalism
  description: Minimal EVM source footprint, WASM surface compactness, and module size budgets.
  run: bun .agents/uphill/metrics/footprint.ts
  # Line count per production Zig file; keep guillotine-mini minimal and auditable (<400 lines/file).
  zig-file-lines:
    description: Keep production Zig files concise (<=400 lines) to preserve guillotine-mini's minimal architecture.
    poor: 1000
    weight: 2
  # Source byte size of each core WASM-compiled EVM module under src/ and wasm/.
  wasm-surface-bytes:
    description: Keep core EVM modules under src/ and wasm/ compact to protect the <=2.5 MiB WASM binary budget.
    poor: 50kB
    weight: 1.5
  # Line count per production TypeScript file under ts/ and client-ts/.
  ts-file-lines:
    description: Keep TypeScript modules under ts/ and client-ts/ concise (<=300 lines per file).
    poor: 600

verification:
  title: Verification & Tests
  description: Lean 4 formal oracle proofs, Zig inline unit tests, and TypeScript test coverage.
  run: bun .agents/uphill/metrics/verification.ts
  # Every Lean 4 file in spec/lean/ must be free of `sorry` and unproved `axiom` declarations.
  lean-no-sorry:
    description: Never leave `sorry` or unproved `axiom` declarations in spec/lean/**/*.lean.
    weight: 2
  # Count of machine-checked Lean 4 theorems and lemmas in spec/lean/ (target: 120+ proofs).
  lean-theorems:
    description: Expand Lean 4 reference specification proofs in spec/lean/ toward complete opcode/fork coverage.
    better: higher
    poor: 50
  # Share (%) of production Zig modules with inline `test` blocks.
  zig-inline-test-coverage:
    description: Include inline `test` blocks inside production src/ and client/ Zig modules.
    better: higher
    poor: 65
    weight: 1.5
  # Ratio (%) of TypeScript test files to production TypeScript modules across ts/ and client-ts/.
  ts-test-ratio:
    description: Pair every production TypeScript module in ts/ and client-ts/ with dedicated unit tests.
    better: higher
    poor: 80

documentation:
  title: Documentation
  description: Companion *.zig.md design docs and local markdown link integrity.
  run: bun .agents/uphill/metrics/documentation.ts
  # Every Markdown file in the root and docs/ must have zero broken local file links.
  broken-links:
    description: Fix broken relative and root-relative links in root Markdown files and docs/**/*.md.
    weight: 2
  # Share (%) of top-level production src/*.zig modules documented with a companion *.zig.md file.
  companion-doc-coverage:
    description: Maintain companion `*.zig.md` design documentation alongside top-level production `src/*.zig` modules.
    better: higher
    poor: 60

factory:
  title: Factory & Trust
  description: Smithers Cloud projections, cache-poisoning trust boundaries, Obsidian wiki links, and MCP agent readiness.
  run: bun .agents/uphill/metrics/factory.ts
  # .smithers/factory.json and .smithers/home.json must stay synced with FACTORY.ts and HOME.ts.
  factory-projection-sync:
    description: Keep .smithers/factory.json and .smithers/home.json valid and projected from FACTORY.ts and HOME.ts.
    weight: 2
  # Untrusted PRs must never hold SMITHERS_CACHE_WRITE_TOKEN; approvals and merges stay person-only.
  trust-boundary-guard:
    description: Enforce cache-write isolation, canonical main release gating, protected trust roots, and person-only merge policy.
    weight: 2
  # Required Obsidian wiki pages and Mythical History must exist with zero broken [[wikilinks]].
  wiki-link-integrity:
    description: Maintain all core .smithers/wiki pages and Mythical History with zero broken Obsidian wikilinks.
    weight: 1.5
  # Agents must connect via the authenticated Smithers Cloud MCP server and one-time sandbox auth.
  mcp-and-agent-readiness:
    description: Keep .mcp.json, AGENTS.md, and one-time sandbox auth tooling wired to smithers.sh/evmts/guillotine-mini/mcp.
    weight: 1

name: Release

# Automatically runs after CI succeeds on every push to canonical main
# (including merges mirrored from Smithers Cloud). A manual dispatch gets no
# bypass: it publishes only if CI already succeeded for a push of that exact SHA.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  id-token: write

env:
  RUSTUP_TOOLCHAIN: "1.99.0"

jobs:
  verify-and-build:
    name: Build verified release artifacts (${{ matrix.os }})
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       github.repository == 'evmts/guillotine-mini') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            target_label: linux-x86_64
            evmc_ext: so
            build_wasm: true
          - os: macos-15
            target_label: macos-arm64
            evmc_ext: dylib
            build_wasm: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Require CI success for this exact commit on workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          count=$(gh api \
            "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$RELEASE_SHA&event=push&branch=main&status=success&per_page=1" \
            --jq '.total_count')
          if [ "$count" -lt 1 ]; then
            echo "::error::No successful CI push run on main for $RELEASE_SHA; refusing to release."
            exit 1
          fi
          echo "Verified CI push success for $RELEASE_SHA."

      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Install Zig 0.15.2
        uses: xyzzylabs/setup-zig@c0fdcf100ed8a4e5619d2bf55fae0bf0dab9ba0a # v1
        with:
          version: 0.15.2

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Build native static library and EVMC ABI 12 shared library
        run: zig build native evmc -Doptimize=ReleaseFast

      - name: Set up Node 24 for WASM size verification
        if: matrix.build_wasm
        uses: actions/setup-node@v5
        with:
          node-version: '24.12.0'

      - name: Build WASI WASM and modular precompile artifacts
        if: matrix.build_wasm
        run: |
          rustup target add wasm32-unknown-unknown --toolchain "$RUSTUP_TOOLCHAIN"
          npm install --global --ignore-scripts binaryen@132.0.0
          zig build wasm wasm-modular test-wasm-size

      - name: Package platform artifacts and SHA-256 digests
        run: |
          set -euo pipefail
          mkdir -p release-dist
          cp zig-out/lib/libguillotine_mini.a "release-dist/libguillotine_mini-${{ matrix.target_label }}.a"
          cp "zig-out/lib/libguillotine_mini_evmc.${{ matrix.evmc_ext }}" "release-dist/libguillotine_mini_evmc-${{ matrix.target_label }}.${{ matrix.evmc_ext }}"
          if [ "${{ matrix.build_wasm }}" = "true" ]; then
            cp include/guillotine_mini.h release-dist/
            cp zig-out/bin/guillotine_mini.wasm release-dist/
            cp zig-out/bin/guillotine_mini_core.wasm release-dist/
            cp zig-out/bin/precompile-*.wasm release-dist/
            cp zig-out/bin/precompiles.mjs release-dist/
            tar -czf "release-dist/guillotine-mini-wasm-modular-v$(jq -r .version package.json).tar.gz" \
              -C zig-out/bin guillotine_mini_core.wasm precompiles.mjs $(cd zig-out/bin && echo precompile-*.wasm)
          fi
          (cd release-dist && shasum -a 256 * > "SHA256SUMS-${{ matrix.target_label }}.txt")

      - uses: actions/upload-artifact@v6
        with:
          name: release-bundle-${{ matrix.target_label }}
          path: release-dist/*
          retention-days: 14

  publish:
    name: Publish GitHub Release & npm Package
    needs: verify-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24.12.0'
          registry-url: 'https://registry.npmjs.org'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: xyzzylabs/setup-zig@c0fdcf100ed8a4e5619d2bf55fae0bf0dab9ba0a # v1
        with:
          version: 0.15.2
      - uses: actions/download-artifact@v6
        with:
          pattern: release-bundle-*
          merge-multiple: true
          path: release-assets

      - name: Generate trusted Lighthouse Backpressure Audit for release
        run: |
          curl -fsSL https://raw.githubusercontent.com/wevm/uphill/main/install.sh | sh
          export PATH="$HOME/.uphill/bin:$PATH"
          uphill --compact || true
          bun .smithers/scripts/generate-audit-report.ts --verify
          cp .smithers/audit/index.html release-assets/lighthouse-audit-report.html
          cp .smithers/audit/report.json release-assets/lighthouse-audit-report.json

      - name: Combine checksums and publish versioned GitHub Release when tag is new
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version package.json)
          TAG="v${VERSION}"
          (cd release-assets && cat SHA256SUMS-*.txt > SHA256SUMS.txt)
          jq -n \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --arg sha "$RELEASE_SHA" \
            --arg voltaire "$(jq -r .voltaire.revision native-dependencies.json)" \
            '{version: $version, tag: $tag, commit: $sha, voltaireRevision: $voltaire}' \
            > release-assets/release-manifest.json

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; verified reproducible artifacts for ${RELEASE_SHA} without overwriting tagged release."
            cat .smithers/audit/latest.md >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          gh release create "$TAG" release-assets/* \
            --target "$RELEASE_SHA" \
            --title "$TAG" \
            --generate-notes \
            --notes-file .smithers/audit/latest.md
          echo "Published GitHub Release ${TAG} at ${RELEASE_SHA}."

      - name: Publish @tevm/guillotine-mini to npm with provenance (when NPM_TOKEN is configured)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p zig-out/bin
          cp release-assets/guillotine_mini.wasm zig-out/bin/
          cp release-assets/guillotine_mini_core.wasm zig-out/bin/
          cp release-assets/precompile-*.wasm zig-out/bin/
          cp release-assets/precompiles.mjs zig-out/bin/
          npm pack --dry-run
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::notice::NPM_TOKEN secret is not set; verified npm pack dry-run and skipped registry publish."
            exit 0
          fi
          VERSION=$(jq -r .version package.json)
          if npm view "@tevm/guillotine-mini@${VERSION}" version >/dev/null 2>&1; then
            echo "@tevm/guillotine-mini@${VERSION} is already published on npm."
            exit 0
          fi
          npm publish --provenance --access public

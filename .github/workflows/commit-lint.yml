name: Commit Message Lint

on:
  push:
    branches:
      - main
      - '**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate Conventional Commit subjects
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # On a branch's first push, lint the tip commit, including a root commit.
          if [[ "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            revisions=(-1 "$AFTER_SHA")
          else
            revisions=("$BEFORE_SHA..$AFTER_SHA")
          fi

          git log --format=%s "${revisions[@]}" | perl -CS -e '
            # \X consumes a whole emoji grapheme, including modifiers or joiners.
            my $ok_regex = qr{
              \A (?:
                Merge[ ].+
                |
                (?:(?=\p{Extended_Pictographic}|\p{Emoji_Presentation}|[0-9#*]\x{FE0F}?\x{20E3})\X[ ]*)?
                (?:feat|fix|chore|docs|refactor|test|perf|ci|build|style|revert)
                (?:\([^()]+\))? !? :[ ]\S.*
              ) \z
            }x;

            my $bad = 0;
            while (my $subject = <STDIN>) {
              chomp $subject;
              next if $subject =~ $ok_regex;
              print STDERR "::error title=Invalid commit subject::$subject\n";
              $bad = 1;
            }
            exit $bad;
          '

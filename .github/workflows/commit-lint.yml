name: Commit Message Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate Conventional Commit subjects
        env:
          BEFORE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          AFTER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # A new branch or force-push can leave the previous commit unavailable.
          if [[ -n "$BEFORE_SHA" ]] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            revisions=("$BEFORE_SHA..$AFTER_SHA")
          else
            revisions=(-1 "$AFTER_SHA")
          fi

          git log --format=%s "${revisions[@]}" | perl -CS -e '
            # \X consumes a whole emoji grapheme, including modifiers or joiners.
            my $ok_regex = qr{
              \A (?:
                Merge[ ].+
                |
                (?:(?=\p{Extended_Pictographic}|\p{Emoji_Presentation}|[0-9#*]\x{FE0F}?\x{20E3})\X[ ]*)?
                (?:feat|fix|chore|docs|refactor|test|perf|ci|build|style|revert)
                (?:\([^()]+\))? !? :[ ]\S.*
              ) \z
            }x;

            my $bad = 0;
            while (my $subject = <STDIN>) {
              chomp $subject;
              next if $subject =~ $ok_regex;
              print STDERR "::error title=Invalid commit subject::$subject\n";
              $bad = 1;
            }
            exit $bad;
          '

name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    # Zig 0.15.x cannot link against the latest macOS SDK; revisit with Zig upgrades.
    runs-on: macos-15
    defaults:
      run:
        working-directory: guillotine-mini
    steps:
      - uses: actions/checkout@v5
        with:
          path: guillotine-mini
          submodules: recursive
      - name: Read native dependency pin
        id: native
        working-directory: .
        run: echo "voltaire=$(jq -r .voltaire.revision guillotine-mini/native-dependencies.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: evmts/voltaire
          ref: ${{ steps.native.outputs.voltaire }}
          path: voltaire
          submodules: recursive
      - name: Install Zig 0.15.2
        uses: xyzzylabs/setup-zig@c0fdcf100ed8a4e5619d2bf55fae0bf0dab9ba0a # v1
        with:
          version: 0.15.2
      - name: Install .NET SDK for Nethermind
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build native crypto archive
        working-directory: voltaire
        run: cargo build --release --lib
      - name: Build
        run: zig build
      - name: Test
        run: zig build test
      - name: Unit and native trace regressions
        run: zig build unit test-trace -Doptimize=ReleaseSafe

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: "1.99.0"

jobs:
  build-test:
    if: github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        # Zig 0.15.x cannot link against newer macOS SDKs.
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - &checkout_project
        uses: actions/checkout@v5
      - &check_voltaire_pin
        name: Verify Voltaire pin parity (build.zig.zon vs native-dependencies.json)
        run: |
          set -euo pipefail
          pin=$(jq -r .voltaire.revision native-dependencies.json)
          grep -Fq "evmts/voltaire/archive/${pin}.tar.gz" build.zig.zon
      - &install_zig
        name: Install Zig 0.15.2
        uses: xyzzylabs/setup-zig@c0fdcf100ed8a4e5619d2bf55fae0bf0dab9ba0a # v1
        with:
          version: 0.15.2
      - name: Check Zig build formatting
        run: zig fmt --check build.zig build.zig.zon
      - &install_rust
        name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - &cache_cargo
        name: Cache Cargo downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('native-dependencies.json') }}
      - name: Build
        run: zig build
      - name: Build native static library
        run: zig build native
      - name: Compile Zig examples
        run: zig build examples
      - name: Run all Zig examples and compare the EIP-3155 trace
        run: sh test/examples.sh
      - name: Test Lean differential harness
        run: zig build lean-diff-unit
      - name: Unit tests
        run: zig build unit
      - name: Native trace regressions
        run: zig build test-trace -Doptimize=ReleaseSafe
      - name: Native test suite
        run: zig build test
      - name: Test utilities and header validator
        run: zig build test-utils test-header-validator
      - name: Compile EVM benchmarks
        run: zig build check-bench-evm
      - name: Verify clean-room zig fetch --save consumer build
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/pkg/guillotine-mini"
          tar --exclude=.git --exclude=.jj --exclude=.zig-cache --exclude=zig-out --exclude=node_modules --exclude=docs/node_modules --exclude=execution-specs --exclude=ethereum-tests --exclude=execution-spec-tests -cf - . | tar -xf - -C "$tmp/pkg/guillotine-mini"
          tar -czf "$tmp/guillotine-mini.tar.gz" -C "$tmp/pkg" guillotine-mini
          mkdir -p "$tmp/consumer"
          cd "$tmp/consumer"
          zig init
          zig fetch --save "$tmp/guillotine-mini.tar.gz"
          cat > src/main.zig << 'EOF'
          const evm = @import("guillotine_mini");
          pub fn main() void {
              _ = evm.Hardfork.OSAKA;
          }
          EOF
          cat > build.zig << 'EOF'
          const std = @import("std");
          pub fn build(b: *std.Build) void {
              const target = b.standardTargetOptions(.{});
              const optimize = b.standardOptimizeOption(.{});
              const dep = b.dependency("guillotine_mini", .{ .target = target, .optimize = optimize });
              const exe = b.addExecutable(.{
                  .name = "consumer-smoke",
                  .root_module = b.createModule(.{
                      .root_source_file = b.path("src/main.zig"),
                      .target = target,
                      .optimize = optimize,
                      .imports = &.{.{ .name = "guillotine_mini", .module = dep.module("guillotine_mini") }},
                  }),
              });
              if (target.result.os.tag == .linux) exe.root_module.linkSystemLibrary("gcc_s", .{});
              b.step("run", "Run consumer smoke").dependOn(&b.addRunArtifact(exe).step);
          }
          EOF
          zig build run

  factory-audit:
    name: Factory, Trust & Lighthouse Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *checkout_project
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - *install_zig
      - name: Run factory trust, auth, home, wiki, and audit tests
        run: bun test ./.smithers/scripts/
      - name: Verify personalized Home UI projection and Obsidian Wiki links
        run: |
          bun .smithers/scripts/project-home.ts --check
          bun .smithers/scripts/sync-wiki-feed.ts --check
      - name: Run Uphill and generate Lighthouse Backpressure Audit Report
        run: |
          curl -fsSL https://raw.githubusercontent.com/wevm/uphill/main/install.sh | sh
          export PATH="$HOME/.uphill/bin:$PATH"
          uphill check
          uphill --compact
          bun .smithers/scripts/generate-audit-report.ts --verify
          cat .smithers/audit/latest.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Lighthouse Backpressure Audit Report
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-backpressure-audit
          path: |
            .smithers/audit/index.html
            .smithers/audit/report.json
            .smithers/audit/latest.md
          retention-days: 14

  smithers:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      SMITHERS_CACHE_READ_TOKEN: ${{ secrets.SMITHERS_CACHE_READ_TOKEN }}
      SMITHERS_CACHE_WRITE_TOKEN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'evmts/guillotine-mini' && secrets.SMITHERS_CACHE_WRITE_TOKEN || '' }}
    steps:
      - *checkout_project
      - *install_zig
      - *install_rust
      - *cache_cargo
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install WASM optimizer
        run: npm install --global --ignore-scripts binaryen@132.0.0
      - name: Install Rust WASM target
        run: |
          rustup default "$RUSTUP_TOOLCHAIN"
          rustup target add wasm32-unknown-unknown --toolchain "$RUSTUP_TOOLCHAIN"
      - name: Plan the Smithers CI graph (trust-enforced)
        run: bun .smithers/scripts/run-trusted-ci.ts --attestation-out .smithers/reports/ci-attestation.json ci '//...' --plan
      - name: Run the native Smithers CI targets (trust-enforced)
        run: |
          bun .smithers/scripts/run-trusted-ci.ts ci '//.smithers/...' '//src/...' '//ts/...' \
            '//:test_unit' '//:test_spec_runner' '//:test_trace' '//:test_wasm' --verbose

  ts-sdk:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - *checkout_project
      - uses: actions/setup-node@v5
        with:
          node-version: '24.12.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Run TypeScript SDK & ExEx tests
        run: bun test ./ts/

  lean-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - *checkout_project
      - *install_zig
      - *install_rust
      - *cache_cargo
      - name: Install the pinned Lean 4 toolchain
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: spec/lean
          auto-config: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - name: Fuzz EVM execution against the Lean oracle
        run: LEAN_DIFF_REQUIRE=1 zig build lean-diff -Doptimize=ReleaseFast

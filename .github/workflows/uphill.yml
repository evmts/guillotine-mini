name: Uphill

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  uphill:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - uses: xyzzylabs/setup-zig@c0fdcf100ed8a4e5619d2bf55fae0bf0dab9ba0a # v1
        with:
          version: 0.15.2

      - name: Run Uphill
        uses: wevm/uphill@main
